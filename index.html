<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧食品營養標籤產生器 V3.5 (完美對齊版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        
        body { 
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
        }

        /* 熱感應列印高對比純黑設定 */
        .sharp-print-target {
            color: #000000 !important;
            background-color: #ffffff !important;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        /* 營養標示內部表格僅套用橫線（下邊框） */
        .horizontal-border-table {
            border-collapse: collapse !important;
            width: 100%;
        }
        .horizontal-border-table th, 
        .horizontal-border-table td {
            border: none !important;
            border-bottom: 1px solid #000000 !important; /* 僅保留水平橫線 */
            padding: 2px 4px;
        }
        /* 移除最後一行的下邊框，確保底部視覺美觀 */
        .horizontal-border-table tr:last-child td {
            border-bottom: none !important;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbykEJlgGLa2QtghRDhy_bAXiJBSRJ9tLIriEiMwwlLf-rVqe204dXTJg92zv4Twmjep-Q/exec";

        const DEFAULT_PRODUCTS = [
            {
                id: "p_default",
                name: "鐵觀音可麗露",
                servingWeight: 50,             
                toleranceWeight: 5,            
                lossRate: 12,
                storageMethod: "冷凍保存",
                storageDays: 7,
                origin: "台灣",
                manufacturer: "露癡工作室",
                phone: "03-3520080", 
                address: "桃園市蘆竹區錦秀街13巷13號", 
                insurance: "本產品已投保南山產物產品責任險22A0089468",
                fontSize: 11,          
                lineSpacing: 1.25,      
                labelWidth: 8,          
                labelHeight: 5,         
                orientation: "landscape", 
                showEatingMethod: true,        
                eatingMethod: "退冰5分鐘後即可食用", 
                ingredients: [
                    { name: "全脂牛奶", weight: 100 },
                    { name: "砂糖", weight: 80 },
                    { name: "雞蛋", weight: 50 },
                    { name: "日本愛心低粉", weight: 45 },
                    { name: "伊思尼無鹽奶油", weight: 20 },
                    { name: "麥斯蘭姆酒", weight: 15 },
                    { name: "鐵觀音茶粉", weight: 10 }
                ]
            }
        ];

        function App() {
            const [products, setProducts] = useState(DEFAULT_PRODUCTS);
            const [nutritionDb, setNutritionDb] = useState([]); 
            const [selectedProductId, setSelectedProductId] = useState('p_default');
            const [dbSearchQuery, setDbSearchQuery] = useState('');
            const [syncStatus, setSyncStatus] = useState('初始化中...');
            const [applyFdaRules, setApplyFdaRules] = useState(true);

            // 食材選擇表單 State
            const [selectedDbIngredient, setSelectedDbIngredient] = useState('');
            const [inputWeight, setInputWeight] = useState('');
            const [customIngName, setCustomIngName] = useState('');

            const [bleDevice, setBleDevice] = useState(null);
            const [bleCharacteristic, setBleCharacteristic] = useState(null);
            const [bleStatus, setBleStatus] = useState('未連線');

            useEffect(() => {
                const local = localStorage.getItem('local_products_v35');
                if (local) {
                    try { setProducts(JSON.parse(local)); } catch(e) { console.log(e); }
                }

                if (GAS_API_URL && !GAS_API_URL.includes("填入您的")) {
                    setSyncStatus('🔍 正在從試算表讀取資料庫...');
                    
                    fetch(`${GAS_API_URL}?action=loadProducts`, { redirect: 'follow' })
                        .then(res => res.json())
                        .then(cloudData => {
                            if (cloudData && Array.isArray(cloudData) && cloudData.length > 0) {
                                const updatedCloudData = cloudData.map(p => ({
                                    ...p,
                                    fontSize: p.fontSize || 11,
                                    lineSpacing: p.lineSpacing || 1.25,
                                    labelWidth: p.labelWidth || 8,
                                    labelHeight: p.labelHeight || 5,
                                    orientation: p.orientation || "landscape"
                                }));
                                setProducts(updatedCloudData);
                                setSelectedProductId(updatedCloudData[0].id);
                            }
                        })
                        .catch(err => console.error("讀取配方失敗:", err));

                    fetch(`${GAS_API_URL}?action=getNutrition`, { redirect: 'follow' })
                        .then(res => res.json())
                        .then(result => {
                            if (result && Array.isArray(result)) {
                                const parsedDb = result.map((row, idx) => ({
                                    id: `db_${idx}`,
                                    category: row[0] || '',
                                    name: row[1] ? row[1].toString().trim() : '', 
                                    commonName: row[2] ? row[2].toString().trim() : '', 
                                    kcal: Number(row[3]) || 0, protein: Number(row[4]) || 0, fat: Number(row[5]) || 0,
                                    satFat: Number(row[6]) || 0, transFat: Number(row[7]) || 0, carb: Number(row[8]) || 0,
                                    sugar: Number(row[9]) || 0, sodium: Number(row[10]) || 0      
                                }));
                                setNutritionDb(parsedDb);
                                setSyncStatus(`✅ 連線成功！已由雲端載入 ${parsedDb.length} 筆原料`);
                            }
                        })
                        .catch(err => setSyncStatus('⚠️ 雲端資料庫讀取失敗'));
                } else {
                    setSyncStatus('⚠️ 運作於單機模式');
                }
            }, []);

            const handleSyncToCloud = () => {
                setSyncStatus('🚀 正在傳輸資料至 Google 試算表...');
                localStorage.setItem('local_products_v35', JSON.stringify(products));

                fetch(GAS_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ action: 'saveProducts', products: products }),
                    redirect: 'follow'
                })
                .then(res => res.json())
                .then(res => {
                    if (res && res.success) {
                        setSyncStatus(`✅ 成功上傳！共同步 ${res.count} 筆配方至雲端`);
                    } else {
                        setSyncStatus(`❌ 上傳失敗: ${res.error || '未知錯誤'}`);
                    }
                })
                .catch(err => setSyncStatus(`❌ 上傳連線失敗`));
            };

            const currentProduct = useMemo(() => {
                const prod = products.find(p => p.id === selectedProductId) || products[0] || DEFAULT_PRODUCTS[0];
                return {
                    ...prod,
                    fontSize: prod.fontSize || 11,
                    lineSpacing: prod.lineSpacing || 1.25,
                    labelWidth: prod.labelWidth || 8,
                    labelHeight: prod.labelHeight || 5,
                    orientation: prod.orientation || "landscape",
                    ingredients: prod.ingredients || []
                };
            }, [products, selectedProductId]);

            const filteredNutritionDb = useMemo(() => {
                if (!dbSearchQuery.trim()) return nutritionDb;
                const q = dbSearchQuery.toLowerCase();
                return nutritionDb.filter(d => d.name.toLowerCase().includes(q) || d.commonName.toLowerCase().includes(q));
            }, [nutritionDb, dbSearchQuery]);

            const allergenWarning = useMemo(() => {
                const keywords = { "乳": "乳製品", "奶": "乳製品", "蛋": "蛋類", "小麥": "麩質穀物", "麵粉": "麩質穀物", "花生": "花生", "堅果": "堅果", "杏仁": "堅果", "芝麻": "芝麻", "大豆": "大豆" };
                const detected = []; 
                if (currentProduct && currentProduct.ingredients) {
                    currentProduct.ingredients.forEach(ing => {
                        Object.keys(keywords).forEach(key => {
                            if (ing.name.includes(key) && !detected.includes(keywords[key])) detected.push(keywords[key]);
                        });
                    });
                }
                return detected.length > 0 ? `過敏原提示：本產品含有${detected.join('、')}及其製品，不適合對其過敏體質者食用。` : "";
            }, [currentProduct]);

            const sortedIngredientsText = useMemo(() => {
                if (!currentProduct || !currentProduct.ingredients || currentProduct.ingredients.length === 0) return "無";
                const sorted = [...currentProduct.ingredients].sort((a, b) => (Number(b.weight) || 0) - (Number(a.weight) || 0));
                return sorted.map(i => i.name).join('、');
            }, [currentProduct]);

            const calculatedLabel = useMemo(() => {
                let totalRawWeight = 0, kcal = 0, protein = 0, fat = 0, satFat = 0, transFat = 0, carb = 0, sugar = 0, sodium = 0;
                
                if (currentProduct && currentProduct.ingredients) {
                    currentProduct.ingredients.forEach(ing => {
                        const dbItem = nutritionDb.find(d => d.name === ing.name);
                        const weight = Number(ing.weight) || 0;
                        totalRawWeight += weight;
                        if (dbItem) {
                            const ratio = weight / 100;
                            kcal += (dbItem.kcal || 0) * ratio; protein += (dbItem.protein || 0) * ratio; fat += (dbItem.fat || 0) * ratio;
                            satFat += (dbItem.satFat || 0) * ratio; transFat += (dbItem.transFat || 0) * ratio; carb += (dbItem.carb || 0) * ratio;
                            sugar += (dbItem.sugar || 0) * ratio; sodium += (dbItem.sodium || 0) * ratio;
                        }
                    });
                }

                const lossRate = Number(currentProduct.lossRate) || 0;
                const finalProductWeight = totalRawWeight * (1 - lossRate / 100);
                const factor100g = finalProductWeight > 0 ? (100 / finalProductWeight) : 0;
                const numWeight = Number(currentProduct.servingWeight) || 50;
                const factorServing = finalProductWeight > 0 ? (numWeight / finalProductWeight) : 0;

                const format = (val, isInt, type) => {
                    let formatted = Number(val);
                    if (applyFdaRules) {
                        if (type === 'sodium' && formatted < 5) return "0";
                        if (type === 'transFat' && formatted < 0.3) return "0";
                        if (['protein', 'fat', 'satFat', 'carb', 'sugar'].includes(type) && formatted < 0.5) return "0";
                    }
                    return isInt ? Math.round(formatted).toString() : (Math.round(formatted * 10) / 10).toFixed(1);
                };

                return {
                    serving: {
                        kcal: format(kcal * factorServing, true, 'kcal'), protein: format(protein * factorServing, false, 'protein'),
                        fat: format(fat * factorServing, false, 'fat'), satFat: format(satFat * factorServing, false, 'satFat'),
                        transFat: format(transFat * factorServing, false, 'transFat'), carb: format(carb * factorServing, false, 'carb'),
                        sugar: format(sugar * factorServing, false, 'sugar'), sodium: format(sodium * factorServing, true, 'sodium')
                    },
                    p100g: {
                        kcal: format(kcal * factor100g, true, 'kcal'), protein: format(protein * factor100g, false, 'protein'),
                        fat: format(fat * factor100g, false, 'fat'), satFat: format(satFat * factor100g, false, 'satFat'),
                        transFat: format(transFat * factor100g, false, 'transFat'), carb: format(carb * factor100g, false, 'carb'),
                        sugar: format(sugar * factor100g, false, 'sugar'), sodium: format(sodium * factor100g, true, 'sodium')
                    }
                };
            }, [currentProduct, nutritionDb, applyFdaRules]);

            const handleUpdateField = (field, value) => {
                setProducts(prev => prev.map(p => p.id === selectedProductId ? { ...p, [field]: value } : p));
            };

            /* 新增食材至當前配方 */
            const handleAddIngredient = () => {
                const nameToAdd = customIngName.trim() || selectedDbIngredient;
                const weightNum = Number(inputWeight);

                if (!nameToAdd) {
                    alert("請選擇或輸入食材名稱！");
                    return;
                }
                if (!weightNum || weightNum <= 0) {
                    alert("請輸入正確的重量(g)！");
                    return;
                }

                setProducts(prev => prev.map(p => {
                    if (p.id === selectedProductId) {
                        const existingIdx = p.ingredients.findIndex(i => i.name === nameToAdd);
                        let updated = [...p.ingredients];
                        if (existingIdx >= 0) {
                            updated[existingIdx].weight = Number(updated[existingIdx].weight) + weightNum;
                        } else {
                            updated.push({ name: nameToAdd, weight: weightNum });
                        }
                        return { ...p, ingredients: updated };
                    }
                    return p;
                }));

                setInputWeight('');
                setCustomIngName('');
            };

            /* 刪除食材 */
            const handleRemoveIngredient = (index) => {
                setProducts(prev => prev.map(p => {
                    if (p.id === selectedProductId) {
                        const updated = p.ingredients.filter((_, idx) => idx !== index);
                        return { ...p, ingredients: updated };
                    }
                    return p;
                }));
            };

            /* 修改食材重量 */
            const handleIngredientWeightChange = (index, newWeight) => {
                setProducts(prev => prev.map(p => {
                    if (p.id === selectedProductId) {
                        const updated = [...p.ingredients];
                        updated[index].weight = Number(newWeight) || 0;
                        return { ...p, ingredients: updated };
                    }
                    return p;
                }));
            };

            const downloadImage = () => {
                const element = document.getElementById('nutrition-label-card');
                html2canvas(element, { scale: 3, backgroundColor: "#ffffff" }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = `${currentProduct.name}_精準標籤.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                });
            };

            const handleConnectBluetooth = async () => {
                if (!navigator.bluetooth) {
                    alert("請使用 Chrome 瀏覽器以支援藍芽功能！");
                    return;
                }
                try {
                    setBleStatus("搜尋中...");
                    const device = await navigator.bluetooth.requestDevice({
                        acceptAllDevices: true,
                        optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb', '49535343-fe7d-4ae5-8fa9-9fafd205e455']
                    });
                    setBleStatus(`連接中...`);
                    const server = await device.gatt.connect();
                    const services = await server.getPrimaryServices();
                    let targetChar = null;
                    for (const service of services) {
                        const characteristics = await service.getCharacteristics();
                        targetChar = characteristics.find(c => c.properties.write || c.properties.writeWithoutResponse);
                        if (targetChar) break;
                    }
                    if (targetChar) {
                        setBleDevice(device);
                        setBleCharacteristic(targetChar);
                        setBleStatus(`已連線：${device.name || "藍芽出單機"}`);
                    }
                } catch (error) {
                    setBleStatus(`連線失敗`);
                }
            };

            const handlePrintBluetooth = async () => {
                if (!bleCharacteristic) return alert("請先連線藍芽印表機！");
                try {
                    setBleStatus("生成高清晰列印中...");
                    const element = document.getElementById('nutrition-label-card');
                    const canvas = await html2canvas(element, { scale: 2, backgroundColor: "#ffffff" });
                    const ctx = canvas.getContext('2d');
                    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    
                    const width = canvas.width, height = canvas.height;
                    const bytesPerLine = Math.ceil(width / 8);
                    let cmd = [0x1B, 0x40, 0x1B, 0x61, 0x01];
                    cmd.push(0x1D, 0x76, 0x30, 0x00, bytesPerLine & 0xFF, (bytesPerLine >> 8) & 0xFF, height & 0xFF, (height >> 8) & 0xFF);

                    for (let y = 0; y < height; y++) {
                        for (let x = 0; x < bytesPerLine; x++) {
                            let byteVal = 0;
                            for (let bit = 0; bit < 8; bit++) {
                                const pxX = x * 8 + bit;
                                if (pxX < width) {
                                    const idx = (y * width + pxX) * 4;
                                    const gray = imgData.data[idx]*0.299 + imgData.data[idx+1]*0.587 + imgData.data[idx+2]*0.114;
                                    if (gray < 160) byteVal |= (0x80 >> bit);
                                }
                            }
                            cmd.push(byteVal);
                        }
                    }
                    cmd.push(0x1B, 0x64, 0x04, 0x1D, 0x56, 0x41, 0x03);
                    const sendData = new Uint8Array(cmd);

                    for (let i = 0; i < sendData.length; i += 20) {
                        await bleCharacteristic.writeValueWithoutResponse(sendData.slice(i, i + 20));
                        await new Promise(r => setTimeout(r, 20));
                    }
                    setBleStatus(`列印完成！`);
                } catch (e) {
                    setBleStatus(`列印失敗`);
                }
            };

            const handleCreateNewManualProduct = () => {
                const newId = 'p_man_' + Date.now();
                setProducts(prev => [{
                    id: newId, name: "全新手動輸入配方", servingWeight: 50, toleranceWeight: 5, lossRate: 0, storageMethod: "冷凍保存", storageDays: 7,
                    origin: "台灣", manufacturer: "露癡工作室", phone: "03-3520080", address: "桃園市蘆竹區錦秀街13巷13號",
                    insurance: "本產品已投保南山產物產品責任險", fontSize: 11, lineSpacing: 1.25, labelWidth: 8, labelHeight: 5, orientation: "landscape", showEatingMethod: true, eatingMethod: "解凍後即可食用", ingredients: []
                }, ...prev]);
                setSelectedProductId(newId);
            };

            const isLandscape = currentProduct.orientation === "landscape";
            const widthCm = isLandscape ? Math.max(currentProduct.labelWidth, currentProduct.labelHeight) : Math.min(currentProduct.labelWidth, currentProduct.labelHeight);
            const heightCm = isLandscape ? Math.min(currentProduct.labelWidth, currentProduct.labelHeight) : Math.max(currentProduct.labelWidth, currentProduct.labelHeight);
            const cardWidthPx = widthCm * 37.8;
            const cardHeightPx = heightCm * 37.8;

            return (
                <div class="min-h-screen flex flex-col">
                    <header class="bg-gradient-to-r from-teal-800 to-emerald-900 text-white shadow-md py-4 px-6 flex justify-between items-center flex-wrap gap-4">
                        <div>
                            <h1 class="text-base sm:text-lg font-black tracking-wide">智慧食品包裝標籤產生器 V3.5 (絕不跑版)</h1>
                            <p class="text-[10px] text-teal-200 font-bold">{syncStatus}</p>
                        </div>
                        <button onClick={handleSyncToCloud} class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-black px-4 py-2 rounded-lg shadow-md text-xs">
                            <i class="fa-solid fa-cloud-arrow-up mr-1.5"></i>儲存並同步至試算表
                        </button>
                    </header>

                    <main class="flex-grow max-w-7xl mx-auto px-4 py-6 w-full grid grid-cols-1 lg:grid-cols-12 gap-6">
                        {/* 左側面板：設定與配方編輯 */}
                        <div class="lg:col-span-6 flex flex-col gap-4">
                            {/* 配方選擇器 */}
                            <div class="bg-white rounded-xl shadow-sm border p-4 flex gap-2">
                                <select value={selectedProductId} onChange={e => setSelectedProductId(e.target.value)} class="flex-1 p-2 border text-xs rounded font-bold bg-white">
                                    {products.map(p => <option key={p.id} value={p.id}>📝 {p.name}</option>)}
                                </select>
                                <button onClick={handleCreateNewManualProduct} class="bg-teal-600 text-white font-bold px-3 text-xs rounded-lg shadow hover:bg-teal-700">新增</button>
                            </div>

                            {/* 食材與配方管理區塊 (重獲光明！) */}
                            <div class="bg-white rounded-xl shadow-sm border p-4 text-xs flex flex-col gap-3">
                                <h3 class="font-black text-slate-800 text-sm flex justify-between items-center border-b pb-2">
                                    <span><i class="fa-solid fa-utensils text-teal-600 mr-1.5"></i>食材與配方內容</span>
                                    <span class="text-[11px] font-normal text-slate-500">共 {currentProduct.ingredients.length} 項成分</span>
                                </h3>

                                {/* 搜尋與選擇食材 */}
                                <div class="bg-slate-50 p-3 rounded-lg border flex flex-col gap-2">
                                    <div class="flex gap-2">
                                        <input 
                                            type="text" 
                                            placeholder="🔍 關鍵字過濾雲端食材..." 
                                            value={dbSearchQuery} 
                                            onChange={e => setDbSearchQuery(e.target.value)} 
                                            class="w-full p-1.5 border rounded bg-white"
                                        />
                                    </div>
                                    <div class="grid grid-cols-12 gap-2">
                                        <select 
                                            value={selectedDbIngredient} 
                                            onChange={e => { setSelectedDbIngredient(e.target.value); setCustomIngName(''); }} 
                                            class="col-span-7 p-1.5 border rounded font-bold bg-white"
                                        >
                                            <option value="">-- 請選擇資料庫食材 --</option>
                                            {filteredNutritionDb.map(item => (
                                                <option key={item.id} value={item.name}>
                                                    {item.name} {item.commonName ? `(${item.commonName})` : ''}
                                                </option>
                                            ))}
                                        </select>
                                        <input 
                                            type="number" 
                                            placeholder="重量(g)" 
                                            value={inputWeight} 
                                            onChange={e => setInputWeight(e.target.value)} 
                                            class="col-span-3 p-1.5 border rounded font-bold"
                                        />
                                        <button 
                                            onClick={handleAddIngredient} 
                                            class="col-span-2 bg-teal-600 text-white font-bold rounded shadow hover:bg-teal-700 text-xs"
                                        >
                                            加入
                                        </button>
                                    </div>
                                    <div class="flex items-center gap-2 pt-1">
                                        <span class="text-[10px] text-slate-400 font-bold">或自訂：</span>
                                        <input 
                                            type="text" 
                                            placeholder="資料庫沒有？輸入自訂食材名稱" 
                                            value={customIngName} 
                                            onChange={e => { setCustomIngName(e.target.value); setSelectedDbIngredient(''); }} 
                                            class="flex-1 p-1.5 border rounded bg-white text-xs"
                                        />
                                    </div>
                                </div>

                                {/* 已加入的食材清單 */}
                                {currentProduct.ingredients.length > 0 ? (
                                    <div class="max-h-48 overflow-y-auto border rounded divide-y">
                                        {currentProduct.ingredients.map((ing, idx) => (
                                            <div key={idx} class="p-2 flex items-center justify-between hover:bg-slate-50 gap-2">
                                                <span class="font-bold text-slate-700 flex-1 truncate">{ing.name}</span>
                                                <div class="flex items-center gap-1">
                                                    <input 
                                                        type="number" 
                                                        value={ing.weight} 
                                                        onChange={e => handleIngredientWeightChange(idx, e.target.value)} 
                                                        class="w-16 p-1 border rounded text-right font-bold"
                                                    />
                                                    <span class="text-slate-500 font-bold">g</span>
                                                </div>
                                                <button onClick={() => handleRemoveIngredient(idx)} class="text-rose-500 hover:text-rose-700 p-1">
                                                    <i class="fa-solid fa-trash-can"></i>
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    <div class="text-center py-4 text-slate-400 border border-dashed rounded font-bold">
                                        尚未加入任何食材，請由上方選擇並新增！
                                    </div>
                                )}
                            </div>

                            {/* 標籤尺寸與字型調整 */}
                            <div class="bg-amber-50 border border-amber-200 rounded-xl p-4 text-xs flex flex-col gap-3 shadow-sm">
                                <h3 class="font-black text-amber-900 flex items-center justify-between">
                                    <span><i class="fa-solid fa-sliders mr-1.5"></i>標籤尺寸與字型對齊</span>
                                    <span class="bg-amber-200 text-amber-900 px-2 py-0.5 rounded text-[10px]">{widthCm}x{heightCm} cm</span>
                                </h3>
                                
                                <div class="grid grid-cols-3 gap-3 bg-white p-3 rounded-lg border border-amber-200">
                                    <div>
                                        <label class="font-bold text-slate-700 block mb-1">方向</label>
                                        <select value={currentProduct.orientation} onChange={e => handleUpdateField('orientation', e.target.value)} class="w-full p-1.5 border rounded font-bold text-xs bg-white">
                                            <option value="landscape">橫式 (雙欄)</option>
                                            <option value="portrait">直式 (單欄)</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="font-bold text-slate-700 block mb-1">寬 (cm)</label>
                                        <input type="number" min="3" max="15" step="0.5" value={currentProduct.labelWidth} onChange={e => handleUpdateField('labelWidth', Number(e.target.value))} class="w-full p-1.5 border rounded font-bold text-xs" />
                                    </div>
                                    <div>
                                        <label class="font-bold text-slate-700 block mb-1">高 (cm)</label>
                                        <input type="number" min="3" max="15" step="0.5" value={currentProduct.labelHeight} onChange={e => handleUpdateField('labelHeight', Number(e.target.value))} class="w-full p-1.5 border rounded font-bold text-xs" />
                                    </div>
                                </div>

                                <div class="grid grid-cols-2 gap-4 pt-1">
                                    <div>
                                        <label class="font-bold text-slate-700 block mb-1">字體 ({currentProduct.fontSize}px)</label>
                                        <input type="range" min="8" max="16" step="1" value={currentProduct.fontSize} onChange={e => handleUpdateField('fontSize', Number(e.target.value))} class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-teal-600" />
                                    </div>
                                    <div>
                                        <label class="font-bold text-slate-700 block mb-1">行高 ({currentProduct.lineSpacing})</label>
                                        <input type="range" min="1.0" max="1.8" step="0.05" value={currentProduct.lineSpacing} onChange={e => handleUpdateField('lineSpacing', Number(e.target.value))} class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-teal-600" />
                                    </div>
                                </div>
                            </div>

                            {/* 基本商品資訊編輯區 */}
                            <div class="bg-white rounded-xl shadow-sm border p-4 text-xs grid grid-cols-2 gap-3">
                                <div class="col-span-2">
                                    <label class="font-bold text-slate-600 block mb-1">品名</label>
                                    <input type="text" value={currentProduct.name} onChange={e => handleUpdateField('name', e.target.value)} class="w-full p-2 border rounded font-bold" />
                                </div>
                                <div><label class="font-bold text-slate-600 block mb-1">淨重 (g)</label><input type="number" value={currentProduct.servingWeight} onChange={e => handleUpdateField('servingWeight', Number(e.target.value))} class="w-full p-2 border rounded font-black text-teal-800" /></div>
                                <div><label class="font-bold text-slate-600 block mb-1">誤差 (g)</label><input type="number" value={currentProduct.toleranceWeight} onChange={e => handleUpdateField('toleranceWeight', Number(e.target.value))} class="w-full p-2 border rounded font-bold text-rose-700" /></div>
                                <div><label class="font-bold text-slate-600 block mb-1">烘焙損耗率 (%)</label><input type="number" value={currentProduct.lossRate} onChange={e => handleUpdateField('lossRate', Number(e.target.value))} class="w-full p-2 border rounded font-bold text-amber-700" /></div>
                                <div><label class="font-bold text-slate-600 block mb-1">保存天數</label><input type="number" value={currentProduct.storageDays} onChange={e => handleUpdateField('storageDays', e.target.value)} class="w-full p-2 border rounded" /></div>
                                <div class="col-span-2"><label class="font-bold text-slate-600 block mb-1">保存方式</label><input type="text" value={currentProduct.storageMethod} onChange={e => handleUpdateField('storageMethod', e.target.value)} class="w-full p-2 border rounded" /></div>

                                <div class="col-span-2 border-t pt-2">
                                    <div class="flex items-center gap-2 mb-1">
                                        <input type="checkbox" id="chkEating" checked={!!currentProduct.showEatingMethod} onChange={e => handleUpdateField('showEatingMethod', e.target.checked)} class="w-4 h-4 text-teal-600" />
                                        <label htmlFor="chkEating" class="font-black text-teal-900 cursor-pointer">顯示「食用方式」</label>
                                    </div>
                                    {currentProduct.showEatingMethod && <input type="text" value={currentProduct.eatingMethod || ''} onChange={e => handleUpdateField('eatingMethod', e.target.value)} class="w-full p-2 border border-teal-300 rounded bg-teal-50/50" />}
                                </div>

                                <div class="border-t pt-2 col-span-2 grid grid-cols-2 gap-3">
                                    <div><label class="font-bold text-slate-600 block mb-1">原產地</label><input type="text" value={currentProduct.origin} onChange={e => handleUpdateField('origin', e.target.value)} class="w-full p-2 border rounded" /></div>
                                    <div><label class="font-bold text-slate-600 block mb-1">廠商</label><input type="text" value={currentProduct.manufacturer} onChange={e => handleUpdateField('manufacturer', e.target.value)} class="w-full p-2 border rounded" /></div>
                                    <div class="col-span-2">
                                        <label class="font-bold text-slate-600 block mb-1">電話與地址</label>
                                        <div class="flex gap-2">
                                            <input type="text" placeholder="電話" value={currentProduct.phone} onChange={e => handleUpdateField('phone', e.target.value)} class="w-1/3 p-2 border rounded" />
                                            <input type="text" placeholder="地址" value={currentProduct.address} onChange={e => handleUpdateField('address', e.target.value)} class="w-2/3 p-2 border rounded" />
                                        </div>
                                    </div>
                                    <div class="col-span-2"><label class="font-bold text-slate-600 block mb-1">責任險</label><input type="text" value={currentProduct.insurance} onChange={e => handleUpdateField('insurance', e.target.value)} class="w-full p-2 border rounded text-slate-500" /></div>
                                </div>
                            </div>
                        </div>

                        {/* 右側預覽面板 */}
                        <div class="lg:col-span-6 flex flex-col gap-4">
                            <div class="bg-white rounded-xl shadow-sm border p-3 flex flex-wrap justify-between items-center gap-2 text-xs">
                                <div class="flex items-center gap-2">
                                    <button onClick={handleConnectBluetooth} class="bg-blue-600 text-white font-bold px-3 py-2 rounded-lg shadow hover:bg-blue-700 flex items-center gap-1.5">
                                        <i class="fa-bluetooth-b fab"></i>連線藍芽印表機
                                    </button>
                                    <span class="text-[11px] font-bold text-slate-600">{bleStatus}</span>
                                </div>
                                <div class="flex gap-2">
                                    <button onClick={handlePrintBluetooth} disabled={!bleCharacteristic} class={`font-bold px-3 py-2 rounded-lg shadow text-xs ${bleCharacteristic ? 'bg-indigo-600 text-white' : 'bg-slate-300 text-slate-500 cursor-not-allowed'}`}>
                                        <i class="fa-solid fa-print mr-1"></i>藍芽列印
                                    </button>
                                    <button onClick={downloadImage} class="bg-slate-800 text-white font-bold px-3 py-2 rounded-lg shadow hover:bg-slate-900 text-xs">
                                        <i class="fa-solid fa-download mr-1"></i>下載圖片
                                    </button>
                                </div>
                            </div>

                            <div class="bg-slate-300 p-6 rounded-xl border flex justify-center items-center overflow-x-auto min-h-[420px]">
                                {/* 標籤卡片本體 */}
                                <div 
                                    id="nutrition-label-card" 
                                    class="sharp-print-target p-2 text-black border-2 border-black shadow-2xl flex flex-col justify-between overflow-hidden" 
                                    style={{ 
                                        width: `${cardWidthPx}px`, 
                                        height: `${cardHeightPx}px`,
                                        boxSizing: 'border-box',
                                        fontSize: `${currentProduct.fontSize}px`, 
                                        lineHeight: currentProduct.lineSpacing 
                                    }}
                                >
                                    <div class="w-full h-full flex flex-col justify-between">
                                        
                                        <div class={`flex ${isLandscape ? 'flex-row gap-2' : 'flex-col gap-1'} h-full items-stretch`}>
                                            
                                            {/* 左邊商品資訊 */}
                                            <div class={isLandscape ? 'w-[56%] flex flex-col justify-between pr-1' : 'w-full flex flex-col gap-0.5 border-b-2 border-black pb-1'}>
                                                <div class="flex flex-col gap-0.5">
                                                    <div class="font-black text-center tracking-wider mb-1 text-[1.1em] relative pb-1">
                                                        品名：{currentProduct.name}
                                                        <div class="absolute bottom-0 left-0 right-0 h-[2px] bg-black"></div>
                                                    </div>
                                                    <div><strong class="font-black">內容物：</strong>{sortedIngredientsText}</div>
                                                    <div><strong class="font-black">淨重：</strong>{currentProduct.servingWeight || 0}g ± {currentProduct.toleranceWeight || 0}g</div>
                                                    <div><strong class="font-black">保存方式：</strong>{currentProduct.storageMethod}</div>
                                                    <div><strong class="font-black">保存期限：</strong>{currentProduct.storageDays}天</div>
                                                    {currentProduct.showEatingMethod && (
                                                        <div><strong class="font-black">食用方式：</strong>{currentProduct.eatingMethod || "無"}</div>
                                                    )}
                                                    <div><strong class="font-black">原產地：</strong>{currentProduct.origin}</div>
                                                    <div><strong class="font-black">廠商：</strong>{currentProduct.manufacturer}</div>
                                                    <div><strong class="font-black">電話：</strong>{currentProduct.phone}</div>
                                                    <div><strong class="font-black">地址：</strong>{currentProduct.address}</div>
                                                </div>
                                                <div class="text-[0.65em] text-black mt-0.5 leading-tight font-bold">{currentProduct.insurance}</div>
                                            </div>

                                            {/* 右邊營養標示：僅包含橫線邊框的表格 */}
                                            <div class={isLandscape ? 'w-[44%] border-2 border-black p-1 flex flex-col justify-between' : 'w-full border-2 border-black p-1 flex flex-col'}>
                                                <div>
                                                    <div class="text-center font-black tracking-wider pb-0.5 relative mb-1" style={{ fontSize: '1.05em' }}>
                                                        營養標示
                                                        <div class="absolute bottom-0 left-0 right-0 h-[1px] bg-black"></div>
                                                    </div>
                                                    
                                                    <div class="text-[0.8em] font-bold leading-tight px-0.5 relative pb-1 mb-1">
                                                        <div>每一份量 {currentProduct.servingWeight || 0} 公克</div>
                                                        <div>本包裝含 1 份</div>
                                                        <div class="absolute bottom-0 left-0 right-0 h-[2px] bg-black"></div>
                                                    </div>

                                                    <table class="horizontal-border-table text-[0.78em] font-bold">
                                                        <thead>
                                                            <tr>
                                                                <th class="text-left w-2/5 font-normal"></th>
                                                                <th class="text-right w-3/10 font-black">每份</th>
                                                                <th class="text-right w-3/10 font-black">每100g</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody>
                                                            {[
                                                                ["熱量", `${calculatedLabel.serving.kcal}大卡`, `${calculatedLabel.p100g.kcal}大卡`],
                                                                ["蛋白質", `${calculatedLabel.serving.protein}g`, `${calculatedLabel.p100g.protein}g`],
                                                                ["脂肪", `${calculatedLabel.serving.fat}g`, `${calculatedLabel.p100g.fat}g`],
                                                                ["  飽和脂肪", `${calculatedLabel.serving.satFat}g`, `${calculatedLabel.p100g.satFat}g`],
                                                                ["  反式脂肪", `${calculatedLabel.serving.transFat}g`, `${calculatedLabel.p100g.transFat}g`],
                                                                ["碳水化合物", `${calculatedLabel.serving.carb}g`, `${calculatedLabel.p100g.carb}g`],
                                                                ["  糖", `${calculatedLabel.serving.sugar}g`, `${calculatedLabel.p100g.sugar}g`],
                                                                ["鈉", `${calculatedLabel.serving.sodium}mg`, `${calculatedLabel.p100g.sodium}mg`]
                                                            ].map((row, idx) => (
                                                                <tr key={idx}>
                                                                    <td class="text-left">{row[0]}</td>
                                                                    <td class="text-right">{row[1]}</td>
                                                                    <td class="text-right">{row[2]}</td>
                                                                </tr>
                                                            ))}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            </div>

                                        </div>

                                        {/* 底部警語 */}
                                        {allergenWarning && (
                                            <div class="text-[0.7em] font-black border border-black border-dashed p-0.5 mt-0.5 leading-tight">
                                                ⚠️ {allergenWarning}
                                            </div>
                                        )}

                                    </div>
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
